<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS PWA standalone 모드 활성화 (홈 화면 추가 시 native 앱처럼 동작 + pull-to-refresh 가능) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ThemeAnalyzer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="AI 테마 분석 기반 주식 종목 선정 대시보드" />
    <meta property="og:title" content="Theme Analyzer" />
    <meta property="og:description" content="AI 테마 분석 기반 주식 종목 선정 대시보드" />
    <meta property="og:image" content="https://xxonbang.github.io/theme-analyzer/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Theme Analyzer</title>
    <script>
      (function(){var m=localStorage.getItem('theme-mode');var d=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.classList.add('dark')})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {})
        })
      }
    </script>
  </body>
</html>
