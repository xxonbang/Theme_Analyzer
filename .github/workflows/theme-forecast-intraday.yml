name: Theme Forecast Intraday

on:
  # 외부 cron-job(workflow_dispatch)으로 실행:
  #   KST 09:30, 10:00, 10:30, 11:30, 13:00, 13:30, 14:30 (7회)
  # schedule:
  #   - cron: '30 0 * * 1-5'   # 09:30 KST
  #   - cron: '30 1 * * 1-5'   # 10:30 KST
  #   - cron: '30 2 * * 1-5'   # 11:30 KST
  #   - cron: '30 4 * * 1-5'   # 13:30 KST
  #   - cron: '30 5 * * 1-5'   # 14:30 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast-intraday:
    concurrency:
      group: theme-forecast-intraday
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Notify start via Telegram
        if: vars.TELEGRAM_NOTIFY == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MESSAGE="<b>[Theme Forecast Intraday] 시작</b>
          장중 테마 예측 업데이트"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday forecast
        id: analysis
        env:
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          GEMINI_API_KEY_02: ${{ secrets.GEMINI_API_KEY_02 }}
          GEMINI_API_KEY_03: ${{ secrets.GEMINI_API_KEY_03 }}
          GEMINI_API_KEY_04: ${{ secrets.GEMINI_API_KEY_04 }}
          GEMINI_API_KEY_05: ${{ secrets.GEMINI_API_KEY_05 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python forecast_main.py --intraday 2>&1 | tee /tmp/task.log

      - name: Get date for cache key
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore KIS token cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}
          restore-keys: kis-token-

      - name: Collect intraday volume profile
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collect_volume_profile.py --intraday 2>&1 | tee -a /tmp/task.log

      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}

      - name: Commit forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f frontend/public/data/theme-forecast.json ]; then
            # 수집된 데이터 백업
            cp frontend/public/data/theme-forecast.json /tmp/theme-forecast-collected.json
            cp -r frontend/public/data/forecast-history/ /tmp/forecast-history-collected/ 2>/dev/null || true
            cp frontend/public/data/forecast-history-index.json /tmp/forecast-history-index-collected.json 2>/dev/null || true
            [ -f frontend/public/data/volume-profile.json ] && cp frontend/public/data/volume-profile.json /tmp/volume-profile-collected.json || true

            # push 경합 시 최대 3회 재시도
            for attempt in 1 2 3; do
              echo "=== Push attempt $attempt ==="

              git fetch origin main
              git reset --hard origin/main

              # 수집된 데이터 복원
              cp /tmp/theme-forecast-collected.json frontend/public/data/theme-forecast.json
              if [ -d /tmp/forecast-history-collected ]; then
                mkdir -p frontend/public/data/forecast-history
                cp -r /tmp/forecast-history-collected/* frontend/public/data/forecast-history/
              fi
              if [ -f /tmp/forecast-history-index-collected.json ]; then
                cp /tmp/forecast-history-index-collected.json frontend/public/data/forecast-history-index.json
              fi
              git add frontend/public/data/theme-forecast.json
              git add frontend/public/data/forecast-history/ frontend/public/data/forecast-history-index.json 2>/dev/null || true
              [ -f /tmp/volume-profile-collected.json ] && cp /tmp/volume-profile-collected.json frontend/public/data/volume-profile.json
              [ -f frontend/public/data/volume-profile.json ] && git add frontend/public/data/volume-profile.json

              if git diff --staged --quiet; then
                echo "No changes to commit"
                exit 0
              fi

              KST_TIME=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
              git commit -m "Theme forecast intraday - $KST_TIME KST"

              if git push origin main; then
                echo "Intraday forecast data committed and pushed"
                exit 0
              fi

              echo "Push failed (attempt $attempt), retrying in 5s..."
              sleep 5
            done

            echo "Push failed after 3 attempts"
            exit 1
          else
            echo "No forecast file generated"
          fi

      - name: Notify completion via Telegram
        if: always() && (failure() || vars.TELEGRAM_NOTIFY == 'true')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          ANALYSIS="${{ steps.analysis.outcome }}"
          JOB="${{ job.status }}"

          if [ "$ANALYSIS" = "success" ] && [ "$JOB" = "success" ]; then
            MESSAGE="<b>[Theme Forecast Intraday] 완료</b>
          장중 테마 예측 업데이트"
          else
            ERROR=$(tail -20 /tmp/task.log 2>/dev/null || echo "로그 없음")
            MESSAGE="<b>[Theme Forecast Intraday] 실패</b>
          장중 테마 예측 업데이트
          <pre>${ERROR}</pre>"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

