name: Collect Investor Data

on:
  # 스케줄은 외부 cron-job(workflow_dispatch 트리거)으로 실행
  # 권장 시각 (KST, KIS 수급 데이터 등록 + 1분):
  #   09:31, 10:01, 11:31, 13:21, 14:31, 15:45, 18:05
  #
  # 수집 항목:
  #   - 수급(외국인/기관/개인 순매수)
  #   - 거래량 TOP30
  #   - 거래대금 TOP30
  #   - 등락률 TOP30 (fluctuation + fluctuation_direct)
  #   - 신규 진입 종목: history, criteria, member 자동 보충
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    concurrency:
      group: investor-data
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify start via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MESSAGE="<b>[THEME_ANALYSIS][Collect Investor Data] 시작</b>
          수급 데이터 수집 (외국인/기관 매매)"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get date for cache key
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore KIS token cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}
          restore-keys: kis-token-

      - name: Collect investor data
        id: analysis
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collect_investor_data.py 2>&1 | tee /tmp/task.log

      - name: Collect macro indicators
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collect_macro_indicators.py 2>&1 | tee -a /tmp/task.log

      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}

      - name: Commit data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 수집된 데이터 백업
          cp frontend/public/data/latest.json /tmp/latest_collected.json
          [ -f frontend/public/data/investor-intraday.json ] && cp frontend/public/data/investor-intraday.json /tmp/investor_intraday_collected.json
          [ -f frontend/public/data/macro-indicators.json ] && cp frontend/public/data/macro-indicators.json /tmp/macro_collected.json
          [ -f frontend/public/data/indicator-history.json ] && cp frontend/public/data/indicator-history.json /tmp/indicator_history_collected.json

          # push 경합 시 최대 3회 재시도
          for attempt in 1 2 3; do
            echo "=== Push attempt $attempt ==="

            git fetch origin main
            git reset --hard origin/main

            # 원격의 필드 보존 (레이스 컨디션 방지)
            python3 scripts/merge_workflow_data.py save-main
            python3 scripts/merge_workflow_data.py save-investor

            # 수집된 데이터 복원 후 커밋
            cp /tmp/latest_collected.json frontend/public/data/latest.json
            [ -f /tmp/investor_intraday_collected.json ] && cp /tmp/investor_intraday_collected.json frontend/public/data/investor-intraday.json
            [ -f /tmp/macro_collected.json ] && cp /tmp/macro_collected.json frontend/public/data/macro-indicators.json
            [ -f /tmp/indicator_history_collected.json ] && cp /tmp/indicator_history_collected.json frontend/public/data/indicator-history.json

            # 원격 필드 병합
            python3 scripts/merge_workflow_data.py merge-main
            python3 scripts/merge_workflow_data.py merge-investor

            git add frontend/public/data/latest.json
            [ -f frontend/public/data/investor-intraday.json ] && git add frontend/public/data/investor-intraday.json
            [ -f frontend/public/data/macro-indicators.json ] && git add frontend/public/data/macro-indicators.json
            [ -f frontend/public/data/indicator-history.json ] && git add frontend/public/data/indicator-history.json

            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            KST_TIME=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
            git commit -m "Update investor data - $KST_TIME KST"

            if git push origin main; then
              echo "Data committed and pushed"
              exit 0
            fi

            echo "Push failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Notify completion via Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          ANALYSIS="${{ steps.analysis.outcome }}"
          JOB="${{ job.status }}"

          if [ "$ANALYSIS" = "success" ] && [ "$JOB" = "success" ]; then
            MESSAGE="<b>[THEME_ANALYSIS][Collect Investor Data] 완료</b>
          수급 데이터 수집 (외국인/기관 매매)"
          else
            ERROR=$(tail -20 /tmp/task.log 2>/dev/null || echo "로그 없음")
            MESSAGE="<b>[THEME_ANALYSIS][Collect Investor Data] 실패</b>
          수급 데이터 수집 (외국인/기관 매매)
          <pre>${ERROR}</pre>"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

