name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  # 데이터 워크플로우 완료 시 자동 배포 (GITHUB_TOKEN push는 다른 워크플로우를 트리거하지 않으므로)
  workflow_run:
    workflows:
      - "Daily Theme Analysis"
      - "Refresh Stock Data"
      - "Collect Investor Data"
      - "Collect Paper Trading Data"
      - "Collect Macro Futures"
      - "Collect Macro Premarket"
      - "Theme Forecast"
      - "Theme Forecast Intraday"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run 트리거 시 성공한 경우에만 배포
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Notify start via Telegram
        if: vars.TELEGRAM_NOTIFY == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MESSAGE="<b>[Deploy Pages] 시작</b>
          프론트엔드 GitHub Pages 배포"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Notify completion via Telegram
        if: failure() || vars.TELEGRAM_NOTIFY == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            MESSAGE="<b>[Deploy Pages] 완료</b>
          프론트엔드 GitHub Pages 배포"
          elif [ "${{ needs.build.result }}" = "skipped" ]; then
            MESSAGE="<b>[Deploy Pages] 스킵</b>
          트리거 워크플로우 실패로 배포 생략"
          else
            MESSAGE="<b>[Deploy Pages] 실패</b>
          프론트엔드 GitHub Pages 배포"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
