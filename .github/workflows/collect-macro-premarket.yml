name: Collect Macro Premarket

on:
  # 외부 cron-job(workflow_dispatch)으로 실행
  # 권장 시각: KST 07:00 (월~금, 장 시작 전)
  #
  # 수집 항목:
  #   - NQ=F (나스닥100 선물, yfinance)
  #   - MU, SOXX, EWY, KORU (KIS 해외주식 전일 종가)
  #   - KOSPI200 지수 (선물 호가 미제공 시 fallback)
  #   - USD, JPY, EUR, CNY 환율 (다중 소스)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    concurrency:
      group: macro-premarket
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get date for cache key
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore KIS token cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}
          restore-keys: kis-token-

      - name: Collect macro indicators (premarket)
        id: collect
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collect_macro_indicators.py 2>&1 | tee /tmp/task.log

      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-${{ steps.cache-date.outputs.date }}

      - name: Commit data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 수집된 데이터 백업
          [ -f frontend/public/data/macro-indicators.json ] && cp frontend/public/data/macro-indicators.json /tmp/macro_collected.json
          [ -f frontend/public/data/indicator-history.json ] && cp frontend/public/data/indicator-history.json /tmp/indicator_history_collected.json

          for attempt in 1 2 3; do
            echo "=== Push attempt $attempt ==="

            git fetch origin main
            git reset --hard origin/main

            # 수집된 데이터 복원
            [ -f /tmp/macro_collected.json ] && cp /tmp/macro_collected.json frontend/public/data/macro-indicators.json
            [ -f /tmp/indicator_history_collected.json ] && cp /tmp/indicator_history_collected.json frontend/public/data/indicator-history.json

            git add frontend/public/data/macro-indicators.json frontend/public/data/indicator-history.json 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            KST_TIME=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
            git commit -m "Premarket macro indicators - $KST_TIME KST"

            if git push origin main; then
              echo "Data committed and pushed"
              exit 0
            fi

            echo "Push failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Notify completion via Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          COLLECT="${{ steps.collect.outcome }}"
          JOB="${{ job.status }}"

          if [ "$COLLECT" = "success" ] && [ "$JOB" = "success" ]; then
            MESSAGE="<b>[Premarket Macro] 완료</b>
          장 전 거시지표 수집 (08:00)"
          else
            ERROR=$(tail -20 /tmp/task.log 2>/dev/null || echo "로그 없음")
            MESSAGE="<b>[Premarket Macro] 실패</b>
          <pre>${ERROR}</pre>"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"

